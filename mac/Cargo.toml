[package]
name = "juicebar-mac"
version.workspace = true
edition.workspace = true
description = "Battery % of wireless mice and keyboards in the Mac menu bar"
license.workspace = true
repository.workspace = true

[[bin]]
name = "JuiceBar"
path = "src/main.rs"

[dependencies]
juicebar-shared = { path = "../shared" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
