[package]
name = "juicebar-windows"
version.workspace = true
edition.workspace = true
description = "Battery % of wireless mice and keyboards in the Windows tray"
license.workspace = true
repository.workspace = true

[lib]
name = "juicebar_windows"
path = "src/lib.rs"

[[bin]]
name = "JuiceBar"
path = "src/main.rs"

[dependencies]
juicebar-shared = { path = "../shared" }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
