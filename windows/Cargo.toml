[package]
name = "juicebar-windows"
version.workspace = true
edition.workspace = true
description = "Battery % of wireless mice and keyboards in the Windows tray"
license.workspace = true
repository.workspace = true

[[bin]]
name = "JuiceBar"
path = "src/main.rs"

[dependencies]
juicebar-shared = { path = "../shared" }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_System_LibraryLoader"]
